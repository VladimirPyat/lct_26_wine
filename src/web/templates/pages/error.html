{% extends "base.html" %}
{% block title %}{{ title }} — Своё Вино{% endblock %}
{% block page_class %}error{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-page__code" aria-hidden="true">{{ status_code }}</p>
  <h1 class="error-page__title">{{ title }}</h1>
  <p class="error-page__text">{{ message }}</p>
  <div class="error-page__actions">
    <a class="btn btn--primary" href="/">Сканировать этикетку</a>
    <a class="btn btn--ghost" href="/catalog">Открыть каталог</a>
  </div>
</section>
{% endblock %}
