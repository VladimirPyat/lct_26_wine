<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% block title %}Своё Вино — сканер этикеток{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('ui_static', path='img/znak.png').path }}">
  <link rel="stylesheet" href="{{ url_for('ui_static', path='css/tokens.css').path }}">
  <link rel="stylesheet" href="{{ url_for('ui_static', path='css/app.css').path }}">
  <script type="module" src="{{ url_for('ui_static', path='js/ui.js').path }}"></script>
  <script type="module" src="{{ url_for('ui_static', path='js/store.js').path }}"></script>
  {% block scripts %}{% endblock %}
</head>
<body class="page page--{% block page_class %}default{% endblock %}"
      data-placeholder-src="{{ url_for('ui_static', path='img/bottle_placeholder.svg').path }}">
  <a class="skip-link" href="#main">К содержимому</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="{{ url_for('ui_static', path='img/znak.png').path }}" alt="" width="26" height="24">
        <span class="brand__name">Своё Вино</span>
      </a>
      <nav class="site-nav" aria-label="Основное меню">
        <a class="site-nav__link" href="/" {% if nav == 'scan' %}aria-current="page"{% endif %}>Сканер</a>
        <a class="site-nav__link" href="/catalog" {% if nav == 'catalog' %}aria-current="page"{% endif %}>Каталог</a>
        <a class="site-nav__link" href="/me" {% if nav == 'me' %}aria-current="page"{% endif %}>Мои вина</a>
      </nav>
      <button type="button" class="btn btn--small btn--ghost site-header__auth" data-auth-toggle hidden>Войти</button>
    </div>
  </header>

  <main id="main" class="container main">
    {% block content %}{% endblock %}
  </main>

  <nav class="tabbar" aria-label="Навигация по приложению">
    <a class="tabbar__item" href="/catalog" {% if nav == 'catalog' %}aria-current="page"{% endif %}>
      <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" /></svg>
      <span>Каталог</span>
    </a>
    <a class="tabbar__item tabbar__item--scan" href="/" {% if nav == 'scan' %}aria-current="page"{% endif %}>
      <span class="tabbar__scan-circle">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3" /><circle cx="12" cy="12" r="3.5" /></svg>
      </span>
      <span>Сканер</span>
    </a>
    <a class="tabbar__item" href="/me" {% if nav == 'me' %}aria-current="page"{% endif %}>
      <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
      <span>Мои вина</span>
    </a>
  </nav>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
</body>
</html>
