# Paths to ONNX / weights (new repo will remap)
yolo_model_path: bin/yolo_detect_labels_2.onnx
# DINO path + embedding_dim live in config/database.yaml (Stage 1)
# phocr_weights_dir: bin/phocr

compute:
  # Local demo: cuda. CPU upload server: set cpu (+ keep onnxruntime, not -gpu).
  device: cuda         # cpu | cuda — PHOCR + DINO ORT EP only (not YOLO)
  cv_threads: 0        # 0 = library default
  ort_threads: 0

cropper:
  device: cpu   # cpu | cuda | auto — YOLO ORT only; default cpu (online-safe)
  confidence: 0.5
  input_size: 640
  letterbox_color: [114, 114, 114]
  output_dir: data/tmp/crops
  box_area_min: 0.05
  box_area_max: 0.50
  box_conf_keep_ratio: 0.85
  # Catalog import: reject crops with width OR height below this (no full-frame embed)
  min_crop_side: 100
  catalog_crops_dir: data/tmp/catalog_crops
  catalog_crops_review_dir: data/tmp/catalog_crops_review
