# OCR + fuzzy rerank + eval decision policy (Stage 2B).
# Image/SIFT confidence and formatter top-3/6 are intentionally absent.

ocr:
  engine: phocr          # phocr | llm | mock
  llm_task: ocr_label    # used when engine=llm (src/llm/tasks/{name}.yaml)
  lang: ru
  limit_side_len: 1150
  min_confidence: 0.0
  min_line_chars: 3
  drop_spaced_letters: true

hybrid:
  rerank_top: 10
  fuzzy:
    token_min_len: 4
    token_fuzz_min: 84.0
    short_field_len: 16
    short_field_score_floor: 0.92
    short_field_dampen: 0.1
    coverage_weight: 1.8
    token_hit_weight: 0.45
    mfr_compact_high: 0.85
    mfr_compact_mid: 0.70
    mfr_bonus_high: 1.2
    mfr_bonus_mid: 0.6
    primary_line_cap: 8
    prefilter_min_candidates: 3
    exact_title_token_bonus: 0.75
    title_token_ratio_min: 90.0
    shortlist_idf_weight: 2.0
    token_edit_max: 2
    token_edit_max_frac: 0.5
    token_edit_idf_scale: 0.5
    # Confident rerank evidence: producer words that do not identify a producer,
    # and title words that are color / sweetness / generic (not a brand).
    producer_stopwords: [винодельня, винодельни, поместье, estate, шато, chateau,
      domaine, winery, wines, wine, вино, вина, усадьба, хозяйство, компания, ооо, ао, зао]
    generic_title_tokens: [красное, белое, розовое, оранжевое, сухое, полусухое,
      полусладкое, сладкое, брют, экстра, игристое, вино, wine, red, white, rose, розе,
      dry, brut, blend, бленд]

confidence:
  text:
    field_weights: { title: 1.0, manufacturer: 1.0, category: 0.15 }
    match_multipliers: { exact: 2.0, partial: 1.0, weak: 0.5 }
    ratio_mins:
      exact: 0.92
      partial: 0.72
      weak: 0.55

# Eval decision policy (see agent_docs/contracts/eval_predict.md).
# enable_not_found_gate is Stage 3 product only — must not null eval slug.
policy:
  top_k: 5
  margin_min: 0.01       # fallback when no margin_tiers entry matches score_1
  # OCR when score_1 - score_2 < margin_min of the first tier with score_1 >= min_score.
  # Bands match product.yaml confidence (high 0.80 / medium 0.65).
  margin_tiers:
    - {min_score: 0.80, margin_min: 0.03}   # high: near-ties only (identical images)
    - {min_score: 0.65, margin_min: 0.15}   # medium
    - {min_score: 0.0, margin_min: 1.0}     # low: always
  abs_min: 0.2
  enable_rerank: true
  enable_not_found_gate: false
  # always: text leader replaces top-1; confident: only with strong label evidence
  rerank_mode: confident
  strong_combos: [[manufacturer, grape], [manufacturer, brand]]
  # Optional guard: skip a text leader whose cosine is > this below top-1 (null = off).
  max_img_drop: null
  # Label color vs winner category: on conflict switch to the best top-K hit of the
  # label color whose manufacturer OCR confirms. Keys = categories.name; {} = off.
  color_synonyms:
    Красное: [красное, красн, red, rosso, tinto, rouge]
    Белое: [белое, бел, white, bianco, blanco, blanc]
    Розовое: [розовое, розе, rose, rosé, rosado, rosato]
    Оранжевое: [оранжевое, orange, arancione, naranja]

# Per-request JSONL decision log (not HTTP body).
decision_log:
  path: data/tmp/eval_decisions.jsonl
  ocr_lines_cap: 32
