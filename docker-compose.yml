services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: vine
      POSTGRES_PASSWORD: vine
      POSTGRES_DB: vine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vine -d vine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
